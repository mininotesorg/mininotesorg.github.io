<title id="tt">Hold on the phone, right-click on the PC</title>
<desc id="dd">On the left a finger holds the Groceries icon on a phone and its menu opens: Colour, Icon, Sync and sharing, Move to, Add to the dock, Add to favourites, Temporary, Archive, Move to bin. On the right the same menu opens on the PC after a right-click on the icon.</desc>
