und"/><text x="44" y="216" class="tsb">private</text><rect x="96" y="200" width="80" height="22" rx="11" fill="#fff" stroke="#e8743b" stroke-width="1.3"/><text x="136" y="215" class="tl" text-anchor="middle">two slashes</text><rect x="44" y="226" width="62" height="22" rx="11" fill="#fff" stroke="#e8743b" stroke-width="1.3"/><text x="75" y="241" class="tl" text-anchor="middle">a colon</text><rect x="110" y="226" width="66" height="22" rx="11" fill="#fff" stroke="#e8743b" stroke-width="1.3"/><text x="143" y="241" class="tl" text-anchor="middle">password</text><text x="105" y="270" class="tq" text-anchor="middle">all together, no spaces</text></g><rect x="215" y="52" width="170" height="330" rx="22" class="body"/><rect x="282" y="57" width="36" height="4" rx="2" fill="#f5f1e6" fill-opacity=".35"/><clipPath id="c2"><rect x="225" y="66" width="150" height="302" rx="12"/></clipPath><rect x="225" y="66" width="150" height="302" rx="12" fill="#fbf9f3"/><g clip-path="url(#c2)"><rect x="225" y="66" width="150" height="302" fill="#1d2721" fill-opacity=".45"/><rect x="235" y="146" width="130" height="150" rx="12" class="box"/><text x="247" y="172" class="tsb">Password</text><rect x="245" y="186" width="110" height="32" rx="6" fill="#fff" stroke="#285646" stroke-width="1.5"/><text x="255" y="207" class="ts">river-moon-lamp</text><path d="M329 202Q339 193 349 202Q339 211 329 202z" fill="none" stroke="#1d2721" stroke-width="1.8"/><circle cx="339" cy="202" r="3" fill="#1d2721"/><rect x="295" y="252" width="58" height="30" rx="8" fill="#285646"/><text x="324" y="271.5" class="tw" text-anchor="middle">Open</text></g><rect x="410" y="52" width="170" height="330" rx="22" class="body"/><rect x="477" y="57" width="36" height="4" rx="2" fill="#f5f1e6" fill-opacity=".35"/><clipPath id="c3"><rect x="420" y="66" width="150" height="302" rx="12"/></clipPath><rect x="420" y="66" width="150" height="302" rx="12" fill="#fbf9f3"/><g clip-path="url(#c3)"><rect x="420" y="66" width="150" height="302" fill="#3d3361"/><rect x="434" y="90" width="12" height="10" rx="2" fill="#f5f1e6"/><path d="M436.2 90v-3a3.8 3.8 0 0 1 7.6 0v3" fill="none" stroke="#f5f1e6" stroke-width="2"/><text x="454" y="98" class="tcb">Private</text><circle cx="556" cy="86" r="1.8" fill="#f5f1e6"/><circle cx="556" cy="92" r="1.8" fill="#f5f1e6"/><circle cx="556" cy="98" r="1.8" fill="#f5f1e6"/><rect x="432" y="122" width="36" height="36" rx="9" fill="#d9cff0"/><path d="M441.7 135h16.6" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M441.7 140.7h16.6" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M441.7 146.5h10.8" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><text x="450" y="172" class="tc" text-anchor="middle">Letters</text><rect x="478" y="122" width="36" height="36" rx="9" fill="#cfd9f0"/><path d="M485.9 133.5h7.2l2.5 2.9h10.4v12.2h-20.2z" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><text x="496" y="172" class="tc" text-anchor="middle">Papers</text><rect x="524" y="122" width="36" height="36" rx="9" fill="#f0d9cf"/><path d="M533.7 135h16.6" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M533.7 140.7h16.6" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M533.7 146.5h10.8" stroke="#1d2721" stroke-opacity=".5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><text x="542" y="172" class="tc" text-anchor="middle">Plans</text><circle cx="540" cy="338" r="18" fill="#7a6bb0"/><line x1="532.4" y1="338" x2="547.6" y2="338" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><line x1="540" y1="330.4" x2="540" y2="345.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><g transform="translate(339 202)"><circle cx="0" cy="0" r="12" class="touch"/><circle cx="0" cy="0" r="20" class="ring2"/><g transform="rotate(-25)"><rect x="-9.5" y="-2" width="19" height="62" rx="9.5" class="skin"/><rect x="-5.5" y="1.5" width="11" height="11" rx="4.5" fill="#fff" fill-opacity=".75"/><line x1="-5.5" y1="30" x2="5.5" y2="30" stroke="#1d2721" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".35"/></g></g><text x="16" y="418" class="lbls">In any note: the word</text><text x="16" y="438" class="lbls">private, two slashes,</text><text x="16" y="458" class="lbls">a colon, then your</text><text x="16" y="478" class="lbls">password.</text><text x="211" y="418" class="lbls">The code vanishes and</text><text x="211" y="438" class="lbls">a box opens. Hold the</text><text x="211" y="458" class="lbls">eye to see the</text><text x="211" y="478" class="lbls">password.</text><text x="406" y="418" class="lbls">Its own colour and</text><text x="406" y="438" class="lbls">lock. Back closes it,</text><text x="406" y="458" class="lbls">and so do five</text><text x="406" y="478" class="lbls">minutes unused.</text>
</svg>
