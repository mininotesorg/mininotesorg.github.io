<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="tt dd">
<title id="tt">Opening a private space</title>
<desc id="dd">Three phone screens. 1: in a note the word private is followed by labels standing for two slashes, a colon and the password, all together. 2: the code has vanished and a Password box opens; a finger holds the eye to show the password. 3: the private space, on its own dark violet colour, with a lock beside Private and a plus button.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.lbl{fill:#f5f1e6;font-size:18px}
