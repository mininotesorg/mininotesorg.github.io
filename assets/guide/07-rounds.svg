<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">The rounds beside a note’s title</title>
<desc id="dd">On the left a finger taps the round A on a phone: Ana’s picture shows big with her menu: Ana’s page, Chat on Parlons!, Writing colour, Sharing. On the right the pointer rests on the round B on the PC and a box says Ben, Can write, Has the newest writing, 1 file still going to him. The lines of the note are in the colour of who wrote them, and the rounds are ringed in the same colours.</desc>
