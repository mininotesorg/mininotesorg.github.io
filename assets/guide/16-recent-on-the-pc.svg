<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-labelledby="tt dd">
<title id="tt">Recent on the PC</title>
<desc id="dd">A PC window. Down the left the Recent column under Menu, newest first; a right-click on Recipes opens its menu with Remove from Recent. The divider at the right of the column can be dragged to resize or fold it. Beside the search box a button shows the cards of Recent, as does Ctrl+Tab.</desc>
