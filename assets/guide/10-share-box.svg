<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">The Share box</title>
<desc id="dd">The Share box for Trip to Lyon. At the top a Where it is card, Home, Travel, with Show it. Then What they may do: Can read, Can write (chosen), Admin. Then People: Ana, Can write; Cleo, Removed here; Ben, Can read, with his drop-down open on Admin, Can write, Can read and Remove. Then Groups: Friends. At the foot Show my code and Done.</desc>
