" stroke-width="1.5"/><text x="248" y="92.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">3</text><circle cx="80" cy="100" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="80" y="104.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">4</text><circle cx="212" cy="100" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="212" y="104.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">5</text><circle cx="170" cy="130" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="170" y="134.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">6</text><circle cx="232" cy="155" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="232" y="159.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">7</text><circle cx="160" cy="174" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="160" y="178.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">8</text><circle cx="318" cy="50" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="54.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">1</text><text x="336" y="56" class="lbls">Back to Home</text><circle cx="318" cy="96" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="100.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">2</text><text x="336" y="102" class="lbls">Hold the title: the note’s menu</text><circle cx="318" cy="142" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="146.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">3</text><text x="336" y="148" class="lbls">The Agent, and ⋮ for This note</text><circle cx="318" cy="188" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="192.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">4</text