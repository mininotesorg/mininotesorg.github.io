<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-labelledby="tt dd">
<title id="tt">Carrying an icon onto the drop strip</title>
<desc id="dd">A finger holds the Groceries icon and carries it to the top of the screen, where a strip offers Favourite, Temp, Archive, Bin and Share. Temp is lit under the icon. The place it came from shows as a dashed outline.</desc>
