<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">Into and out of folders</title>
<desc id="dd">On the left a finger carries the Groceries note onto the Recipes note: letting go makes a new folder holding both. On the right the Trip to Lyon folder is open as a card; its Map is carried out past the card, and the card steps aside. Pausing on the card title goes up one level.</desc>
