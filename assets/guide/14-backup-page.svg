<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-labelledby="tt dd">
<title id="tt">The Backup page</title>
<desc id="dd">The Backup page on a phone, with one folder card: USB key: Backups. Everything, each day at 20:00, keeps the newest 5, sealed with the lock, last backup today at 20:00. Buttons Back up now, Change and Remove. Under the card: Add a folder, and Add from a backup.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.lbl{fill:#f5f1e6;font-size:18px}
