oke="#fff" stroke-width="1.5"/><text x="246" y="186.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">3</text><circle cx="246" cy="204" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="246" y="208.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">4</text><circle cx="246" cy="266" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="246" y="270.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">5</text><circle cx="318" cy="46" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="50.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">1</text><text x="336" y="52" class="lbls">What: Everything, or</text><text x="336" y="72" class="lbls">Everything but the files</text><circle cx="318" cy="116" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="120.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">2</text><text x="336" y="122" class="lbls">When: when you ask, each</text><text x="336" y="142" class="lbls">day, week or month at an</text><text x="336" y="162" class="lbls">hour, or when it closes</text><circle cx="318" cy="206" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="210.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">3</text><text x="336" y="212" class="lbls">How many: the newest</text><text x="336" y="232" class="lbls">1 to 50 are kept</text><circle cx="318" cy="276" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="280.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">4</text><text x="336" y="282" class="lbls">Always sealed: the lock, a</text><text x="336" y="302" class="lbls">password, or 12 words</text><circle cx="318" cy="346" r="9.5" fill="#e8743b" stroke="#fff" stroke-width="1.5"/><text x="318" y="350.3" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:700">5</text><text x="336" y="352" class="lbls">Back up now, any time</text>
</svg>
