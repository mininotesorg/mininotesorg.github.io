<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">The Stamp on Minima window</title>
<desc id="dd">The Stamp on Minima window for Contract.pdf: its SHA-256 fingerprint, a green box saying Stamped on Minima, 4 Nov 2026, block 1 482 905, and the steps: Stamp, Look for it on Minima, Verify again, Open this version, Open the PDF report, Attach the PDF report, Compare with a fingerprint, Stamped before. Beside it a file icon with a small stamp, and a note with its stamp line under the title.</desc>
