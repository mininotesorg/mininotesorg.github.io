<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630" width="600" height="630" role="img" aria-labelledby="tt dd">
<title id="tt">Power gestures on the PC</title>
<desc id="dd">Four PC windows. 1: Ctrl and Tab show the cards of Recent; letting go of Ctrl opens the one framed. 2: Ctrl+click chooses several icons, here two, and the menu acts on all. 3: an icon dragged out of Mininotes onto the Windows desktop is copied there; with Shift held it moves. 4: a file dragged from Explorer onto Temp’s card is kept in Temp.</desc>
