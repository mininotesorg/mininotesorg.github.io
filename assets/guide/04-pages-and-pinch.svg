<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" width="600" height="610" role="img" aria-labelledby="tt dd">
<title id="tt">Pages, the pinch and the main page</title>
<desc id="dd">On the left two fingers pinch Home. On the right every page shows at once, nine small pages with the main page outlined in the middle; a finger carries the top right page onto another and the two swap. A double tap on empty Home goes back to the main page.</desc>
