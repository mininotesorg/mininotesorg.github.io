<title id="tt">Temp</title>
<desc id="dd">On the left Temp is open as a card holding a Notepad, a ticket and a photo; its menu offers Things stay: 1 hour, Send what is in Temp, Sync Temp now, Also show on Home. On the right the Temporary box of Groceries offers 15 minutes, 1 hour, 24 hours and Until I delete it, which is chosen.</desc>
