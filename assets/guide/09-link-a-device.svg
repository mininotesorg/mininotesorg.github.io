<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">Linking one of your devices</title>
<desc id="dd">Six small phone screens in order. 1: People and devices, a finger taps the round plus. 2: the camera scans the other device’s code, with Paste a link and Show my code. 3: What is it? One of my devices is chosen. 4: Also link it with Laptop and Tablet, both ticked. 5: What it gets: Can write is chosen; a finger taps Add. 6: the new phone is listed under My devices, marked new.</desc>
